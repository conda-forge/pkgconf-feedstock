context:
  version: "3.0.7"

package:
  name: pkgconf
  version: ${{ version }}

source:
  url: https://github.com/pkgconf/pkgconf/archive/pkgconf-${{ version }}.tar.gz
  sha256: a9ae678879771fcf15247ac2435e7ad8308be8a5921898e6720b3b8949410f73

build:
  number: 1
  string: ${{ "pkg_config_" if compat == "yes" else "" }}h${{ hash }}_${{ build_number }}
  variant:
    use_keys:
      - compat
    down_prioritize_variant: ${{ 1 if compat == "no" else 0 }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - meson
    - ninja
  run_constraints:
    - if: compat == "yes"
      then:
        # pkg-config symlinks clash with files from the pkg-config package
        - pkg-config <0a0
  run_exports:
    - ${{ pin_subpackage('pkgconf') }}

tests:
  - script:
      - pkgconf --help
      - pkgconf --variable pc_path pkg-config
      - if: unix
        then:
          - test -f $PREFIX/bin/pkgconf.bin
          - if: compat == "yes"
            then:
              - test -L $PREFIX/bin/pkg-config
              - pkg-config --variable pc_path pkg-config
            else:
              - test ! -e $PREFIX/bin/pkg-config
        else:
          - if: compat == "yes"
            then:
              - pkg-config --variable pc_path pkg-config
            else:
              - if exist %LIBRARY_PREFIX%\bin\pkg-config.exe exit 1
          - if not exist %PREFIX%\etc\conda\activate.d\pkgconf_activate.bat exit 1
          - if not exist %PREFIX%\etc\conda\deactivate.d\pkgconf_deactivate.bat exit 1

about:
  license: MIT
  license_file: COPYING
  summary: package compiler and linker metadata toolkit
  homepage: https://github.com/pkgconf/pkgconf
  repository: https://github.com/pkgconf/pkgconf

extra:
  recipe-maintainers:
    - danielnachun
